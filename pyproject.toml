[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voxwerk"
version = "0.1.13"
description = "Local-first speech studio with downloadable Piper voices"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["text-to-speech", "piper", "voice", "local-first"]
dependencies = ["piper-tts>=1.3,<2"]

[project.urls]
Homepage = "https://github.com/Evohl/VoxWerk"
Repository = "https://github.com/Evohl/VoxWerk.git"
Issues = "https://github.com/Evohl/VoxWerk/issues"

[project.scripts]
voxwerk = "voxwerk.app:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
voxwerk = ["web/*"]